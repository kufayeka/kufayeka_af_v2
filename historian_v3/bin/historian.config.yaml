# historian.config.yaml
#
# General notes:
# - All numeric fields may use integer expressions: +, -, *
# - Example: 24 * 60 * 60 * 1000
# - Timestamp unit: us (microseconds) atau ns (nanoseconds)
# - Rekomendasi tuning:
#   * Utamakan ubah 1-2 parameter lalu observasi metrics 10-30 menit.
#   * Naikkan throughput: flushBytes, scanChunkBytes, maxParallel.
#   * Naikkan durability: walPolicy/segmentPolicy -> always atau interval lebih kecil.
#   * Naikkan stabilitas RAM: scanChunkBytes jangan terlalu besar.

udp:
  host: 0.0.0.0       # bind host UDP ingest. use 0.0.0.0 to listen on all NICs.
  port: 9900          # port UDP ingest (1..65535). change if it conflicts with another service.

http:
  host: 0.0.0.0       # bind host HTTP API. use 127.0.0.1 for local-only access.
  port: 8080          # port HTTP API (1..65535).
  maxPoints: 100000   # hard cap for query result rows. Higher values can increase RAM usage/latency.
                     # range umum: 10_000..1_000_000 (default aman: 100_000).
  streamThresholdPoints: 5000 # threshold internal respons besar (kompatibilitas).
                              # range umum: 1_000..20_000.

storage:
  dataDir: ./data     # root folder data historian.
  shardCount: 16      # shard berdasarkan tagId % shardCount.
                      # efek: lebih tinggi -> paralelisme naik, file descriptor & small files juga naik.
                      # range umum: 8..64 (16-32 biasanya ideal).
  partitionDurationMs: 24 * 60 * 60 * 1000 # durasi partisi per file.
                                           # lebih pendek -> query pendek cepat, tapi jumlah file naik.
                                           # longer values create larger files and can improve long-range query efficiency.
                                           # range umum: 1h..7d.
  timestampUnit: us   # us|ns. ns lebih presisi, ukuran timestamp sama (int64), beban parsing setara.

flush:
  flushIntervalMs: 100       # interval scheduler flush queue -> segment.
                            # lebih kecil: latency write turun, syscall/fsync naik.
                            # lebih besar: throughput naik, risiko data di queue saat crash naik.
                            # range umum: 5..200 ms.
  flushBytes: 256 * 1024   # flush is triggered when queue bytes are >= this value.
                          # larger values increase throughput but can delay data visibility in queries.
                          # common range: 256KB..4MB (start at 512KB/1MB for high throughput).
  maxQueuePoints: 200000   # queue limit per key (partition+shard) for backpressure.
                           # terlalu kecil -> drop saat spike; terlalu besar -> RAM naik.
                           # range umum: 50_000..1_000_000.
  backpressurePolicy: drop_new # drop_new|drop_oldest.
                               # drop_new: keeps older data; new data may be dropped during overload.
                               # drop_oldest: prioritizes newest data; older queued history may be displaced.

index:
  indexBlockOnFlush: true     # must be true for time-range pruning in queries.
  enablePerTagSparseIndex: false # reserved; not actively used yet.
  indexStridePerTag: 4096     # reserved. Ignore for now.

retention:
  enabled: false            # true = automatically delete old partitions.
  maxAgeHours: 7 * 24       # umur maksimum data. 7*24=7 hari.
                           # for 90 days: 90*24.
  checkIntervalMs: 5 * 60 * 1000 # interval job retention.
                                 # range umum: 1m..1h (5m-15m biasanya cukup).

query:
  maxParallel: 6            # goroutine query paralel maksimum.
                           # values that are too large may cause CPU/disk contention.
                           # saran awal: jumlah core fisik atau core-1.
  scanChunkBytes: 512 * 1024 # chunk baca per scan range.
                             # lebih kecil: RAM stabil, syscall lebih banyak.
                             # lebih besar: throughput baca naik, peak RAM naik.
                             # range umum: 128KB..2MB (default aman: 512KB).
  fdCacheEnabled: true      # cache file descriptor seg/index (reduce open/close syscall).
  fdCacheMaxOpen: 256       # FD cache limit. Too large values may approach OS FD limits.
                            # common range: 64..1024 (adjust to OS limits and active partition count).
  fdCacheIdleMs: 5 * 1000  # tutup FD idle setelah durasi ini.
                            # lebih kecil: FD hemat tapi reopen lebih sering.
                            # larger values speed up warm queries but keep FDs open longer.
                            # range umum: 10s..120s.

fsync:
  walPolicy: interval       # always|interval|off.
                            # always: durability tertinggi, throughput turun.
                            # interval: balance durability/performance (umum produksi).
                            # off: throughput tinggi, risiko kehilangan data saat crash/power loss.
  walIntervalMs: 200        # active when walPolicy=interval.
                            # lebih kecil: lebih aman, sync lebih sering.
                            # range umum: 100..1000 ms.
  segmentPolicy: interval   # always|interval|off for segment/index files.
  segmentIntervalMs: 500    # active when segmentPolicy=interval.
                            # range umum: 300..2000 ms.




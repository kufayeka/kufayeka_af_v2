[package]
name = "historian_v2"
version = "0.1.0"
edition = "2021"
default-run = "historian_v2"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
num_cpus = "1.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 1

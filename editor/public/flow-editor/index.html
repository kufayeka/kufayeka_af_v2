<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kufayeka Flow Editor</title>
    <link rel="stylesheet" href="/flow-editor/styles.css" />
  </head>
  <body>
    <div id="app" class="flow-shell">
      <aside class="palette">
        <div class="palette-header">
          <div class="palette-topbar">
            <div class="palette-tabs">
              <button id="tab-available" class="palette-tab active" type="button">Available Nodes</button>
              <button id="tab-flows" class="palette-tab" type="button">Flows</button>
            </div>
            <button id="palette-collapse" class="palette-collapse" type="button" title="Collapse sidebar">Collapse</button>
          </div>
          <div id="available-panel" class="palette-panel active">
            <div class="palette-title">Available Nodes</div>
            <input id="palette-search" class="palette-search" type="search" placeholder="Search node" />
          </div>
          <div id="flows-panel" class="palette-panel">
            <div class="palette-title">Flows</div>
          </div>
        </div>
        <div id="available-list" class="palette-panel-content active">
          <div id="palette-list" class="palette-list"></div>
        </div>
        <div id="flows-content" class="palette-panel-content">
          <div class="flows-shell">
            <div class="flow-card flow-list-card">
              <div class="flow-card-header">
                <div class="flow-card-title">Flows</div>
              </div>
              <div class="flows-toolbar">
                <input id="flow-search" class="palette-search" type="search" placeholder="Search flow" />
                <button id="flow-add" type="button">New Flow</button>
              </div>
              <div id="flow-list" class="flow-list"></div>
            </div>
            <div class="flow-card flow-detail-card">
              <div class="flow-card-header">
                <div class="flow-card-title">Flow Detail</div>
                <div id="flow-detail-actions" class="flow-card-actions"></div>
              </div>
              <div id="flow-detail" class="flow-config"></div>
            </div>
            <div class="flow-card flow-vars-card">
              <div class="flow-card-header">
                <div class="flow-card-title">Flow Variables</div>
                <div id="flow-variable-actions" class="flow-card-actions"></div>
              </div>
              <div id="flow-variables" class="flow-config"></div>
            </div>
          </div>
        </div>
      </aside>
      <main class="editor">
        <div class="toolbar">
          <div class="toolbar-left">
            <button type="button" data-zoom="out">-</button>
            <button type="button" data-zoom="reset">100%</button>
            <button type="button" data-zoom="in">+</button>
          </div>
          <div class="toolbar-right">
            <span id="selection-summary">0 selected</span>
          </div>
        </div>
        <div id="viewport" class="viewport" tabindex="0">
          <div id="stage" class="stage">
            <div id="grid" class="grid"></div>
            <div id="group-layer" class="group-layer"></div>
            <svg id="link-layer" class="link-layer"></svg>
            <svg id="overlay-layer" class="overlay-layer"></svg>
            <div id="node-layer" class="node-layer"></div>
            <div id="marquee" class="marquee hidden"></div>
          </div>
        </div>
      </main>
    </div>
    <div id="context-menu" class="context-menu hidden"></div>
    <script src="/flow-editor/main.js"></script>
  </body>
</html>
